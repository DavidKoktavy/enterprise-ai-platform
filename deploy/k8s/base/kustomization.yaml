apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai-platform
labels:
  - pairs:
      app.kubernetes.io/part-of: enterprise-ai-platform
    includeSelectors: false
resources:
  - namespace.yaml
  - serviceaccounts.yaml
  - gateway.yaml
  - lc-examiner.yaml
  - networkpolicies.yaml
configMapGenerator:
  - name: gateway-model-registry
    files:
      - models.yaml=../../../services/gateway/config/models.yaml
  - name: platform-config
    literals:
      - KAFKA_BOOTSTRAP=kafka:9092
      - KAFKA_SECURITY_PROTOCOL=PLAINTEXT
      - KAFKA_AUDIT_TOPIC=ai.gateway.audit
      - REDACT_PII=true
      - BLOCK_PROMPT_INJECTION=true
      - AUDIT_STORE_CONTENT=false
      - GATEWAY_URL=http://ai-gateway:8080
images:
  - name: ai-gateway
    newName: ghcr.io/davidkoktavy/ai-gateway
    newTag: latest
  - name: lc-examiner
    newName: ghcr.io/davidkoktavy/lc-examiner
    newTag: latest
