apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels: { app: kafka }
  template:
    metadata:
      labels: { app: kafka }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: kafka
          image: apache/kafka:3.8.1
          ports:
            - { name: client, containerPort: 9092 }
            - { name: controller, containerPort: 9093 }
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_LOG_DIRS, value: "/var/lib/kafka/data" }
          volumeMounts:
            - { name: data, mountPath: /var/lib/kafka/data }
          resources:
            requests: { cpu: 250m, memory: 768Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 2Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  selector: { app: kafka }
  ports: [{ name: client, port: 9092, targetPort: client }]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-create-topics
spec:
  backoffLimit: 10
  template:
    metadata:
      labels: { ai-gateway-client: "true" }   # reuses the Kafka egress policy
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: topics
          image: apache/kafka:3.8.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              for t in ai.gateway.audit:6 trade.lc.presentations:3 trade.lc.examinations:3 trade.lc.presentations.dlq:1; do
                /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
                  --topic ${t%%:*} --partitions ${t##*:} --replication-factor 1 || exit 1
              done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-ingress
spec:
  podSelector: { matchLabels: { app: kafka } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: ai-gateway } }
        - podSelector: { matchLabels: { ai-gateway-client: "true" } }
      ports: [{ protocol: TCP, port: 9092 }]
  egress:
    - to:
        - podSelector: { matchLabels: { app: kafka } }
