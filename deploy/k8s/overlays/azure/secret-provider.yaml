# Key Vault -> Kubernetes Secret sync (Secrets Store CSI driver, AKS add-on).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: ai-gateway-kv
spec:
  provider: azure
  parameters:
    clientID: <GATEWAY_IDENTITY_CLIENT_ID>
    keyvaultName: <KEY_VAULT_NAME>
    tenantId: <TENANT_ID>
    objects: |
      array:
        - |
          objectName: azure-openai-endpoint
          objectType: secret
        - |
          objectName: eventhubs-connection-string
          objectType: secret
        - |
          objectName: tenant-key-trade-finance
          objectType: secret
        - |
          objectName: tenant-key-retail-chatbot
          objectType: secret
  secretObjects:
    - secretName: ai-gateway-secrets
      type: Opaque
      data:
        - { objectName: azure-openai-endpoint, key: azure-openai-endpoint }
        - { objectName: eventhubs-connection-string, key: eventhubs-connection-string }
        - { objectName: tenant-key-trade-finance, key: tenant-key-trade-finance }
        - { objectName: tenant-key-retail-chatbot, key: tenant-key-retail-chatbot }
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: lc-examiner-kv
spec:
  provider: azure
  parameters:
    clientID: <GATEWAY_IDENTITY_CLIENT_ID>
    keyvaultName: <KEY_VAULT_NAME>
    tenantId: <TENANT_ID>
    objects: |
      array:
        - |
          objectName: tenant-key-trade-finance
          objectType: secret
        - |
          objectName: eventhubs-connection-string
          objectType: secret
  secretObjects:
    - secretName: lc-examiner-secrets
      type: Opaque
      data:
        - { objectName: tenant-key-trade-finance, key: gateway-api-key }
        - { objectName: eventhubs-connection-string, key: eventhubs-connection-string }
