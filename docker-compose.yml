# Local stack: Kafka (KRaft) + AI Gateway + LC Examiner (API + Kafka worker).
# Runs fully offline with the mock LLM provider. To use real Azure OpenAI,
# set AZURE_OPENAI_ENDPOINT/AZURE_OPENAI_API_KEY in .env and FORCE_MOCK_PROVIDER=false.
#
#   docker compose up --build -d
#   python scripts/publish_samples.py        # send LC presentations to Kafka
#   python scripts/consume_results.py        # read examination results

services:
  kafka:
    image: apache/kafka:3.8.1
    container_name: kafka
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-init:
    image: apache/kafka:3.8.1
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for t in ai.gateway.audit:6 trade.lc.presentations:3 trade.lc.examinations:3 trade.lc.presentations.dlq:1; do
          name=$${t%%:*}; parts=$${t##*:}
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists \
            --topic $$name --partitions $$parts --replication-factor 1
        done

  ai-gateway:
    build: ./services/gateway
    ports: ["8080:8080"]
    depends_on:
      kafka-init: { condition: service_completed_successfully }
    environment:
      FORCE_MOCK_PROVIDER: ${FORCE_MOCK_PROVIDER:-true}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      KAFKA_BOOTSTRAP: kafka:29092
      TENANT_KEY_TRADE_FINANCE: ${TENANT_KEY_TRADE_FINANCE:-dev-trade-finance-key}
      TENANT_KEY_RETAIL_CHATBOT: ${TENANT_KEY_RETAIL_CHATBOT:-dev-retail-key}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8080/healthz')\""]
      interval: 5s
      retries: 10

  lc-examiner-api:
    build: ./services/lc-examiner
    ports: ["8081:8080"]
    depends_on:
      ai-gateway: { condition: service_healthy }
    environment:
      GATEWAY_URL: http://ai-gateway:8080
      GATEWAY_API_KEY: ${TENANT_KEY_TRADE_FINANCE:-dev-trade-finance-key}

  lc-examiner-worker:
    build: ./services/lc-examiner
    command: ["python", "-m", "app.worker"]
    depends_on:
      ai-gateway: { condition: service_healthy }
    environment:
      GATEWAY_URL: http://ai-gateway:8080
      GATEWAY_API_KEY: ${TENANT_KEY_TRADE_FINANCE:-dev-trade-finance-key}
      KAFKA_BOOTSTRAP: kafka:29092

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports: ["8090:8080"]
    depends_on: [kafka]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
